name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://swarm:swarm@localhost:7732/swarm

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: swarm
          POSTGRES_PASSWORD: swarm
          POSTGRES_DB: swarm
        ports: ["7732:5432"]
        options: >-
          --health-cmd "pg_isready -U swarm" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy -p kernels-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: cargo nextest run --workspace --all-features
      - name: TypeScript bindings and browser test programs are up to date
        run: git diff --exit-code web/src/lib/protocol web/src/lib/program/fixtures
      # Example programs build with the SDK and pass the checks of an upload (spec 0012).
      - name: Example programs
        working-directory: examples/programs
        run: |
          cargo fmt --all --check
          cargo clippy --target x86_64-unknown-linux-gnu --all-targets -- -D warnings
          cargo test --target x86_64-unknown-linux-gnu
          cargo build --release
          for module in target/wasm32-unknown-unknown/release/*.wasm; do
            cargo run -q --manifest-path ../../Cargo.toml -p programs --features cli -- check "$module"
          done

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      # The Vite build compiles the CPU-fallback kernels (crates/kernels-wasm).
      - uses: dtolnay/rust-toolchain@1.95
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test:unit --run
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: swarm
          POSTGRES_PASSWORD: swarm
          POSTGRES_DB: swarm
        ports: ["7732:5432"]
        options: >-
          --health-cmd "pg_isready -U swarm" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
        working-directory: web
      # Decodes the render page's QR code in the dashboard test.
      - run: sudo apt-get install -y zbar-tools
      - run: cargo build -p coordinator
      - run: pnpm exec playwright test
        working-directory: web
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
