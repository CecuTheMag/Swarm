[package]
name = "timetable"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Weekly school timetables: the model, its exact cost and a deterministic search (spec 0013)"

[lints]
workspace = true

[features]
# TypeScript bindings for the model (the protocol crate exports them).
ts = ["dep:ts-rs"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
ts-rs = { version = "12.0.1", optional = true }

[dev-dependencies]
proptest = "1.12.0"
serde_json = "1.0.154"
