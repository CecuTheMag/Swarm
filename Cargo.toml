[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The reference kernels train networks in tests: optimised, but still checked for
# integer overflow (spec 0011).
[profile.dev.package.kernels]
opt-level = 3

[profile.release]
lto = "thin"
