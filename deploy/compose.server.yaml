# Always-on Swarm on a shared server: `just deploy` copies the committed tree there
# and runs `docker compose -f deploy/compose.server.yaml up -d --build`.
#
#   http://<server>:7780            site, worker page, dashboard (LAN)
#   https://<your domain>           public HTTPS from a Caddy in front of port 7780
#                                   (deploy/front-proxy.caddy, docs/competition/demo-day.md)
#   --profile public                + public HTTPS through Tailscale Funnel (`just public`)
#   --profile fleet                 + simulated CPU workers on the server
#
# The `backup` service dumps the database at start and every night at 03:00 UTC into
# ~/swarm-backups on the server, keeping 14 days (`just backup-check` restores the
# latest one into a scratch database to prove it works).
#
# Only the proxy publishes a port. Browsers allow WebGPU (and the hashing workers use
# to check kernels) only on HTTPS pages, so other devices join through the public
# address.

name: swarm

x-common: &common
  restart: unless-stopped
  labels:
    # Watchtower on the shared server must not replace these with registry images.
    com.centurylinklabs.watchtower.enable: "false"

services:
  postgres:
    <<: *common
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: swarm
      POSTGRES_PASSWORD: swarm
      POSTGRES_DB: swarm
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarm"]
      interval: 5s
      retries: 10

  coordinator:
    <<: *common
    build: { context: .., dockerfile: deploy/coordinator.Dockerfile }
    image: swarm-coordinator
    environment:
      DATABASE_URL: postgres://swarm:swarm@postgres:5432/swarm
      RUST_LOG: info
      # Only whoever knows it starts jobs; anyone may still join as a worker.
      SWARM_SUBMIT_TOKEN: ${SWARM_SUBMIT_TOKEN:?set it in ~/swarm.env on the server}
      # Language models (spec 0017), copied to the server by `just deploy-models`.
      SWARM_MODELS_DIR: /models
    volumes: ["${HOME}/swarm-models:/models:ro"]
    depends_on:
      postgres: { condition: service_healthy }

  backup:
    <<: *common
    image: postgres:18-alpine
    environment:
      PGHOST: postgres
      PGUSER: swarm
      PGPASSWORD: swarm
      PGDATABASE: swarm
      BACKUP_KEEP_DAYS: "14"
      BACKUP_HOUR: "3"
    volumes:
      - "${HOME}/swarm-backups:/backups"
      - ./backup:/scripts:ro
    entrypoint: ["sh", "/scripts/backup.sh"]
    depends_on:
      postgres: { condition: service_healthy }

  web:
    <<: *common
    build: { context: .., dockerfile: deploy/web.Dockerfile }
    image: swarm-web

  proxy:
    <<: *common
    image: caddy:2-alpine
    ports: ["${SWARM_PORT:-7780}:80"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on: [coordinator, web]

  # https://<SWARM_PUBLIC_NAME>.<tailnet>.ts.net → proxy. Runs in userspace, so it
  # needs no privileges; the first start prints a login link (see `just public`).
  tailscale:
    <<: *common
    profiles: [public]
    image: tailscale/tailscale:stable
    hostname: ${SWARM_PUBLIC_NAME:-swarm}
    environment:
      TS_HOSTNAME: ${SWARM_PUBLIC_NAME:-swarm}
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tsstate:/var/lib/tailscale
      - ./tailscale:/config:ro
    depends_on: [proxy]

  sim:
    <<: *common
    profiles: [fleet]
    image: swarm-coordinator
    command: ["sim-worker", "--url", "ws://coordinator:7700/ws/worker", "--workers", "${SIM_WORKERS:-4}"]
    depends_on: [coordinator]

volumes:
  pgdata:
  tsstate:
