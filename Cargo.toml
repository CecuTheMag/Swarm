[workspace]
resolver = "3"
members = ["crates/*", "sdk/rust"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The reference kernels train networks in tests: optimised, but still checked for
# integer overflow (spec 0011).
[profile.dev.package.kernels]
opt-level = 3

# Password hashing is seconds per sign-in unoptimised, enough to time out the browser
# tests on a slow runner; optimised it takes as long as in production.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
