[package]
name = "sim-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
fastrand = "2.5.0"
futures-util = "0.3.34"
hex = "0.4.3"
kernels = { version = "0.1.0", path = "../kernels" }
programs = { version = "0.1.0", path = "../programs", features = ["run"] }
protocol = { version = "0.1.0", path = "../protocol" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rustls = { version = "0.23.28", default-features = false, features = ["ring", "std"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }
