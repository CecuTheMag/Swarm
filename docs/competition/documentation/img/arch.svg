<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Архитектура на Рояк">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b36b00"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0057b3"/></marker>
  </defs>
  <style>
    .t { font-size: 20px; font-weight: bold; fill: #000; }
    .s { font-size: 17.5px; fill: #222; }
    .l { font-size: 14px; font-weight: bold; letter-spacing: 0.06em; fill: #555; }
    .bx { fill: #fff; stroke: #444; stroke-width: 1.3; }
    .core { fill: #fff4e0; stroke: #e08a00; stroke-width: 1.8; }
    .in { fill: #fff; stroke: #e0a040; stroke-width: 1.1; }
    .ws { fill: none; stroke: #b36b00; stroke-width: 1.8; }
    .http { fill: none; stroke: #0057b3; stroke-width: 1.8; }
    .n { fill: none; stroke: #333; stroke-width: 1.5; }
  </style>
  <text x="10" y="16" class="l">УСТРОЙСТВА И ПОТРЕБИТЕЛИ</text>
  <rect x="10" y="26" width="255" height="70" rx="8" class="bx"/>
  <text x="22" y="53" class="t">Телефони и лаптопи</text>
  <text x="22" y="80" class="s">графичен процесор (WebGPU)</text>
  <rect x="10" y="108" width="255" height="70" rx="8" class="bx"/>
  <text x="22" y="135" class="t">Компютри в кабинета</text>
  <text x="22" y="162" class="s">процесор (WebAssembly)</text>
  <rect x="10" y="190" width="255" height="70" rx="8" class="bx"/>
  <text x="22" y="217" class="t">Конзола и изглед на живо</text>
  <text x="22" y="244" class="s">учител, заместник-директор</text>
  <rect x="10" y="272" width="255" height="70" rx="8" class="bx"/>
  <text x="22" y="299" class="t">Скрипт на заявител</text>
  <text x="22" y="326" class="s">ключ за програмния интерфейс</text>

  <path d="M265 61 C302 61 302 142 332 142" class="ws" marker-end="url(#ao)"/>
  <path d="M265 146 H332" class="ws" marker-end="url(#ao)"/>
  <path d="M265 225 C302 225 302 158 332 158" class="http" marker-end="url(#ab)"/>
  <path d="M265 307 C306 307 306 168 332 168" class="http" marker-end="url(#ab)"/>

  <rect x="334" y="104" width="150" height="98" rx="8" class="bx"/>
  <text x="409" y="134" class="t" text-anchor="middle">HTTPS прокси</text>
  <text x="409" y="160" class="s" text-anchor="middle">Caddy,</text>
  <text x="409" y="184" class="s" text-anchor="middle">Let's Encrypt</text>
  <path d="M484 134 H520" class="n" marker-end="url(#ar)"/>
  <path d="M484 184 C502 184 502 302 520 302" class="n" marker-end="url(#ar)"/>

  <rect x="522" y="8" width="470" height="250" rx="10" class="core"/>
  <text x="538" y="35" class="t">Координатор (Rust, axum, tokio)</text>
  <rect x="538" y="46" width="215" height="44" rx="6" class="in"/><text x="550" y="74" class="s">REST API и WebSocket</text>
  <rect x="761" y="46" width="215" height="44" rx="6" class="in"/><text x="773" y="74" class="s">разделяне и наемане</text>
  <rect x="538" y="98" width="438" height="44" rx="6" class="in"/><text x="550" y="126" class="s">проверка: кворум, контролни задачи, репутация</text>
  <rect x="538" y="150" width="438" height="44" rx="6" class="in"/><text x="550" y="178" class="s">шаблони: π, изображение, мрежи, разписания, модели</text>
  <rect x="538" y="202" width="438" height="44" rx="6" class="in"/><text x="550" y="230" class="s">обединяване на резултатите, събития на живо</text>

  <rect x="522" y="272" width="212" height="72" rx="8" class="bx"/>
  <text x="534" y="299" class="t">Уеб приложение</text>
  <text x="534" y="326" class="s">SvelteKit, Node.js</text>
  <path d="M820 258 V282" class="n" marker-end="url(#ar)"/>
  <rect x="746" y="284" width="246" height="60" rx="8" class="bx"/>
  <text x="758" y="309" class="t">PostgreSQL 18</text>
  <text x="758" y="333" class="s">задачи, единици, наеми, мрежи</text>

  <line x1="10" y1="362" x2="40" y2="362" class="ws"/><text x="46" y="368" class="s">WebSocket (JSON)</text>
  <line x1="210" y1="362" x2="240" y2="362" class="http"/><text x="246" y="368" class="s">HTTPS (REST, JSON)</text>
</svg>
