[env]
# TypeScript bindings generated by ts-rs during `cargo test`.
TS_RS_EXPORT_DIR = { value = "web/src/lib/protocol", relative = true }
# Local dev database (compose.yaml). An existing DATABASE_URL takes precedence.
DATABASE_URL = "postgres://swarm:swarm@localhost:7732/swarm"
# Every database test of one binary shares the 20 connections sqlx allows it, and a test
# whose coordinator runs its background loops holds up to five: more than four at once
# starve the rest past sqlx's 30 s timeout. nextest runs each test in its own process
# and is not limited by this.
RUST_TEST_THREADS = "4"
