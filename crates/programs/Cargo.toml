[package]
name = "programs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Checks and runs WebAssembly programs that anyone may run on Swarm (spec 0008)"

[lints]
workspace = true

[features]
# An interpreter for running programs natively (the simulated worker, tests).
run = ["dep:wasmi"]
# Small programs for tests (`programs::fixtures`).
fixtures = ["dep:wat"]
# The `swarm-program` command: checks a module and runs it on one input.
cli = ["run", "dep:anyhow", "dep:clap", "dep:hex"]

[[bin]]
name = "swarm-program"
required-features = ["cli"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
hex = { version = "0.4.3", optional = true }
thiserror = "2.0.21"
wat = { version = "1.263.0", optional = true }
wasmparser = "0.263.0"
wasmi = { version = "2.0.0", optional = true, features = ["simd"] }

[dev-dependencies]
wat = "1.263.0"
