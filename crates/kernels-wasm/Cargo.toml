[package]
name = "kernels-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "WebAssembly build of the reference kernels: the CPU fallback for devices without WebGPU"

[lib]
crate-type = ["cdylib"]

# Not `workspace = true`: the workspace forbids unsafe code, and exporting a
# function from WebAssembly needs `#[unsafe(no_mangle)]`. Everything else is
# denied here as well; the exports are the only allowed exception.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
kernels = { path = "../kernels" }
