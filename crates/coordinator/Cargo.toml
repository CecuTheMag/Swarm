[package]
name = "coordinator"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
dotenvy = "0.15.7"
fastrand = "2.5.0"
getrandom = "0.3"
hex = "0.4.3"
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
kernels = { version = "0.1.0", path = "../kernels" }
png = "0.18.1"
programs = { version = "0.1.0", path = "../programs" }
protocol = { version = "0.1.0", path = "../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sim-worker = { version = "0.1.0", path = "../sim-worker" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "time", "json"] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["serde", "v7"] }

[dev-dependencies]
programs = { path = "../programs", features = ["fixtures", "run"] }
png = "0.18.1"
axum = "0.8.9"
futures-util = "0.3.34"
kernels = { path = "../kernels" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "cookies"] }
time = "0.3.55"
tokio-tungstenite = "0.30.0"
uuid = "1.29.0"
